# One stage: the platform in ONE environment, as one group of jobs:
#
#   plan ─► policies ─► models
#
#   plan      what to run (scripts/release_plan.py): policies when gateway/policy-fragments or its stack changed,
#             models when gateway/foundry-accounts or its stack changed; both for manual runs and release tags.
#             Nothing runs when the repository variable PLATFORM_ENVIRONMENTS doesn't list this environment.
#   policies  the shared gateway policy (gateway/terraform/gateway-policies, state ai-gateway-policies-<env>.tfstate):
#             fragments, gateway-tenant-id, ks-gateway-all, Content Safety backend, telemetry; gateway smoke test
#   models    the environment's hosting accounts (gateway/terraform/platform-deployment, state
#             ai-gateway-models-<env>.tfstate): deployments, backends, kill switches, registry, catalog; model smoke
#             test and Developer Portal
#
# Each job runs only after the previous ones succeeded or had nothing to do, in the GitHub environment model-<env>,
# whose protection rules approve it (required reviewers on uat and prd). plan_only (pull requests): plans only.
name: _stage

on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      plan_only: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      policies: ${{ steps.plan.outputs.policies }}
      models: ${{ steps.plan.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          ENVIRONMENTS: ${{ vars.PLATFORM_ENVIRONMENTS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/release_plan.py "${ENVIRONMENTS:-dev}" $([ "$ALL" = "true" ] && echo --all) --base "$BASE" > plan.txt
          cat plan.txt
          if grep '^environments=' plan.txt | grep -q '"${{ inputs.environment }}"'; then
            grep -v '^environments=' plan.txt >> "$GITHUB_OUTPUT"
          else
            echo "PLATFORM_ENVIRONMENTS (${ENVIRONMENTS:-dev}) doesn't list ${{ inputs.environment }}: nothing to run"
            printf 'policies=false\nmodels=false\n' >> "$GITHUB_OUTPUT"
          fi

  policies:
    name: ${{ inputs.plan_only && 'plan policies' || 'policies' }}
    needs: plan
    if: needs.plan.outputs.policies == 'true'
    runs-on: ubuntu-latest
    environment: model-${{ inputs.environment }}
    concurrency:
      group: policies-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      STACK: gateway/terraform/gateway-policies
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_content_safety_account: ${{ vars.CONTENT_SAFETY_ACCOUNT }}
      TF_VAR_content_safety_resource_group: ${{ vars.CONTENT_SAFETY_RESOURCE_GROUP }}
      TF_VAR_app_insights_name: ${{ vars.APP_INSIGHTS_NAME }}
      TF_VAR_app_insights_resource_group: ${{ vars.APP_INSIGHTS_RESOURCE_GROUP }}
      # The environment's coordinates: variables of the GitHub environment (nothing about environments is in Git).
      APIM_SUBSCRIPTION_ID: ${{ vars.APIM_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_NAME: ${{ vars.APIM_NAME }}
      MODELS_PRODUCT: ${{ vars.MODELS_PRODUCT }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_apim_subscription_id: ${{ vars.APIM_SUBSCRIPTION_ID }}
      TF_VAR_apim_resource_group: ${{ vars.APIM_RESOURCE_GROUP }}
      TF_VAR_apim_name: ${{ vars.APIM_NAME }}
      TF_VAR_models_product: ${{ vars.MODELS_PRODUCT }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          terraform: "true"
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/tf-init
        with:
          stack: ${{ env.STACK }}
          key: ai-gateway-policies-${{ inputs.environment }}.tfstate
          resource-group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          storage-account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          container: ${{ vars.TF_STATE_CONTAINER }}
      - name: Plan
        run: |
          terraform -chdir=$STACK plan -input=false -out=tfplan -no-color | tee plan.txt
          { echo "### Gateway policy (${{ inputs.environment }}): plan"; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: ${{ !inputs.plan_only }}
        run: terraform -chdir=$STACK apply -input=false tfplan
      - name: Smoke test (fragments, global kill switch and model registry on this gateway)
        # Projects live in their own repositories: each one's onboarding and agent pipelines check its model API and
        # agents through these fragments on their next run (or run them on demand after a fragment change).
        if: ${{ !inputs.plan_only }}
        run: |
          base="https://management.azure.com/subscriptions/$APIM_SUBSCRIPTION_ID/resourceGroups/$APIM_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME"
          live=$(az rest --url "$base/policyFragments?api-version=2024-05-01" --query "value[].name" -o tsv | sort)
          want=$(ls gateway/policy-fragments/*.xml | xargs -n1 basename | sed 's/\.xml$//' | sort)
          missing=$(comm -13 <(echo "$live") <(echo "$want"))
          [ -z "$missing" ] || { echo "Fragments missing on $APIM_NAME: $missing"; exit 1; }
          ks=$(az rest --method post --url "$base/namedValues/ks-gateway-all/listValue?api-version=2024-05-01" --query value -o tsv)
          echo "### Gateway policy smoke test (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "fragments on $APIM_NAME: $(echo $live | tr '\n' ' '); global kill switch ks-gateway-all: $ks" | tee -a "$GITHUB_STEP_SUMMARY"
          python gateway/scripts/model_smoke.py models

  models:
    name: ${{ inputs.plan_only && 'plan models' || 'models' }}
    needs: [plan, policies]
    if: ${{ !cancelled() && needs.plan.outputs.models == 'true' && needs.policies.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: model-${{ inputs.environment }}
    concurrency:
      group: models-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      STACK: gateway/terraform/platform-deployment
      TF_VAR_portal_anonymous: ${{ vars.PORTAL_ANONYMOUS || 'false' }}
      # The environment's coordinates: variables of the GitHub environment (nothing about environments is in Git).
      APIM_SUBSCRIPTION_ID: ${{ vars.APIM_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_NAME: ${{ vars.APIM_NAME }}
      MODELS_PRODUCT: ${{ vars.MODELS_PRODUCT }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_apim_subscription_id: ${{ vars.APIM_SUBSCRIPTION_ID }}
      TF_VAR_apim_resource_group: ${{ vars.APIM_RESOURCE_GROUP }}
      TF_VAR_apim_name: ${{ vars.APIM_NAME }}
      TF_VAR_models_product: ${{ vars.MODELS_PRODUCT }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          terraform: "true"
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/tf-init
        with:
          stack: ${{ env.STACK }}
          key: ai-gateway-models-${{ inputs.environment }}.tfstate
          resource-group: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          storage-account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          container: ${{ vars.TF_STATE_CONTAINER }}
      - name: Plan
        run: |
          terraform -chdir=$STACK plan -input=false -out=tfplan -no-color | tee plan.txt
          { echo "### Model platform (${{ inputs.environment }}): plan"; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: ${{ !inputs.plan_only }}
        run: terraform -chdir=$STACK apply -input=false tfplan
      - name: Smoke test and Developer Portal
        if: ${{ !inputs.plan_only }}
        run: |
          python gateway/scripts/model_smoke.py models
          python gateway/scripts/publish_portal.py "models ${GITHUB_SHA::7}"
