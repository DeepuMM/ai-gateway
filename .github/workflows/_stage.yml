# One stage: the platform in ONE environment. gateway policy ─► models, each only when it has something to do (inputs
# from _release.yml's detect) and the models only after the policy succeeded or had nothing to do. Each unit runs in
# the GitHub environment model-<env>, whose protection rules approve it (required reviewers on uat and prd).
name: _stage

on:
  workflow_call:
    inputs:
      environment: {type: string, required: true}
      policies: {type: string, default: "false"}     # "true": the gateway policy unit
      models: {type: string, default: "false"}       # "true": the models unit
      plan_only: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  policies:
    if: inputs.policies == 'true'
    uses: ./.github/workflows/_policies.yml
    with:
      environment: ${{ inputs.environment }}
      plan_only: ${{ inputs.plan_only }}

  models:
    needs: policies
    if: ${{ !cancelled() && inputs.models == 'true' && needs.policies.result != 'failure' }}
    uses: ./.github/workflows/_models.yml
    with:
      environment: ${{ inputs.environment }}
      plan_only: ${{ inputs.plan_only }}
