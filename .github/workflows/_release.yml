# Release of the AI platform, one box per stage (each a _stage.yml call: gateway policy ─► models). Called by
# release.yml.
#
#   detect ─► dev ─► uat ─► prd
#
#   dev   merges to main, manual runs, release tags (pull requests: plans)
#   uat   release tags v*, after dev succeeded; approval (model-uat)
#   prd   release tags v*, after uat succeeded; approval (model-prd)
#
# A stage runs only if the repository variable PLATFORM_ENVIRONMENTS lists it (today: dev; uat and prd are added once
# they have their own resources). Within a stage only what changed runs (scripts/release_plan.py): the policy unit for
# gateway/policy-fragments or its stack, the models unit for gateway/foundry-accounts or its stack; manual runs and
# release tags run both.
name: _release

on:
  workflow_call:
    inputs:
      plan_only: {type: boolean, default: false}

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
      policies: ${{ steps.plan.outputs.policies }}
      models: ${{ steps.plan.outputs.models }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          ENVIRONMENTS: ${{ vars.PLATFORM_ENVIRONMENTS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 scripts/release_plan.py "${ENVIRONMENTS:-dev}" $([ "$ALL" = "true" ] && echo --all) --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  dev:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.environments), 'dev')
    uses: ./.github/workflows/_stage.yml
    with:
      environment: dev
      policies: ${{ needs.detect.outputs.policies }}
      models: ${{ needs.detect.outputs.models }}
      plan_only: ${{ inputs.plan_only }}

  uat:
    needs: [detect, dev]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'uat') && needs.dev.result != 'failure' }}
    uses: ./.github/workflows/_stage.yml
    with:
      environment: uat
      policies: ${{ needs.detect.outputs.policies }}
      models: ${{ needs.detect.outputs.models }}

  prd:
    needs: [detect, dev, uat]
    if: ${{ !cancelled() && !inputs.plan_only && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(fromJson(needs.detect.outputs.environments), 'prd') && needs.dev.result != 'failure' && needs.uat.result != 'failure' }}
    uses: ./.github/workflows/_stage.yml
    with:
      environment: prd
      policies: ${{ needs.detect.outputs.policies }}
      models: ${{ needs.detect.outputs.models }}
