# Releases the AI platform, one stage per environment (_stage.yml: plan ─► policies ─► models):
#
#   dev ─► uat ─► prd
#
#   pull request changing the platform     dev: plans (nothing changes)
#   merge to main changing the platform    dev: the gateway policy and/or the models, whichever changed
#   release tag v*                         dev, then uat, then prd: each after the previous stage succeeded, with
#                                          approval (model-uat, model-prd), when PLATFORM_ENVIRONMENTS lists it
#   manual run                             dev, everything
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["gateway/policy-fragments/**", "gateway/terraform/gateway-policies/**", "gateway/foundry-accounts/**",
            "gateway/terraform/platform-deployment/**"]
  pull_request:
    paths: ["gateway/policy-fragments/**", "gateway/terraform/gateway-policies/**", "gateway/foundry-accounts/**",
            "gateway/terraform/platform-deployment/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_stage.yml
    with:
      environment: dev
      plan_only: ${{ github.event_name == 'pull_request' }}

  uat:
    needs: dev
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/_stage.yml
    with:
      environment: uat

  prd:
    needs: uat
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/_stage.yml
    with:
      environment: prd
